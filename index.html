<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAICK AI Studio - Video Recorder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
      color: #38bdf8;
    }
    .video-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    video {
      width: 100%;
      height: auto;
      display: block;
      background-color: #000;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button, a.btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    #startBtn {
      background-color: #22c55e;
      color: white;
    }
    #startBtn:hover {
      background-color: #16a34a;
    }
    #stopBtn {
      background-color: #ef4444;
      color: white;
    }
    #stopBtn:hover {
      background-color: #dc2626;
    }
    #stopBtn:disabled {
      background-color: #64748b;
      cursor: not-allowed;
    }
    #downloadBtn {
      background-color: #3b82f6;
      color: white;
      display: none;
    }
    #downloadBtn:hover {
      background-color: #2563eb;
    }
    .status {
      margin-top: 15px;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <h1>JAICK AI Studio</h1>
  
  <div class="video-container">
    <video id="preview" autoplay playsinline muted></video>
  </div>

  <div class="controls">
    <button id="startBtn">🔴 Start Recording</button>
    <button id="stopBtn" disabled>⏹️ Stop Recording</button>
    <a id="downloadBtn" class="btn">⬇️ Download Video</a>
  </div>

  <div class="status" id="statusText">Camera ready...</div>

  <script>
    const preview = document.getElementById('preview');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusText = document.getElementById('statusText');

    let mediaRecorder;
    let recordedChunks = [];
    let stream;

    // Start Camera Feed
    async function initCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        preview.srcObject = stream;
        statusText.innerText = "Camera Active - Press Start to Record";
      } catch (err) {
        console.error("Camera access error:", err);
        statusText.innerText = "Error: Camera/Microphone access denied!";
      }
    }

    // Start Recording
    startBtn.addEventListener('click', () => {
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) {
          recordedChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const videoURL = URL.createObjectURL(blob);
        preview.srcObject = null;
        preview.src = videoURL;
        preview.controls = true;
        preview.muted = false;
        preview.play();

        downloadBtn.href = videoURL;
        downloadBtn.download = `jaick-video-${Date.now()}.webm`;
        downloadBtn.style.display = 'inline-block';
        statusText.innerText = "Recording finished! Click Download to save.";
      };

      mediaRecorder.start();
      startBtn.disabled = true;
      stopBtn.disabled = false;
      downloadBtn.style.display = 'none';
      statusText.innerText = "Recording in progress...";
    });

    // Stop Recording
    stopBtn.addEventListener('click', () => {
      mediaRecorder.stop();
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

    initCamera();
  </script>
</body>
</html>
